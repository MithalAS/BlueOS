[project]
name = "remora-camera-manager"
version = "0.1.0"
description = "Manager for handling camera streams and settings."
requires-python = ">=3.11"
dependencies = [
    "anyio==3.7.1",
    "commonwealth==0.1.0",
    "fastapi==0.105.0",
    "fastapi-versioning==0.9.1",
    "loguru==0.5.3",
    "pykson==1.0.2",
    "uvicorn==0.13.4",
]

[tool.uv]
package = false

[tool.uv.sources]
commonwealth = { workspace = true }
pykson = { url = "https://github.com/patrickelectric/pykson/archive/refs/tags/1.0.2.tar.gz" }
